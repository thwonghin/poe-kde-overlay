name: Bump submodule

# GitHub Actions has no way to subscribe to push events on a third-party
# repo (that would require SnosMe/awakened-poe-trade or
# kvan7/Exiled-Exchange-2 to configure a webhook pointing at us), so this
# polls on a schedule instead -- the same approach Renovate/Dependabot use
# for tracking upstreams they don't own. Each vendor (poe1 and poe2
# renderer) gets its own bump PR.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Prevents an overlapping manual trigger from racing the scheduled run (or
# a second manual trigger racing itself) on the same branch.
concurrency:
  group: bump-submodule-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    # Cheap: a single network call, no container/build deps needed, so this
    # can run daily for free regardless of whether anything changed.
    runs-on: ubuntu-latest
    outputs:
      vendors: ${{ steps.diff.outputs.vendors }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      # JSON list of vendors whose upstream HEAD moved, for the matrix below.
      - name: Compare each upstream HEAD to its pinned commit
        id: diff
        run: |
          changed=()
          for vendor in $(git config -f .gitmodules --get-regexp '\.path$' | cut -d' ' -f2 | xargs -n1 basename); do
            url=$(git config -f .gitmodules "submodule.vendor/$vendor.url")
            upstream=$(git ls-remote "$url" HEAD | cut -f1)
            pinned=$(git rev-parse "HEAD:vendor/$vendor")
            if [ "$upstream" != "$pinned" ]; then
              changed+=("\"$vendor\"")
            fi
          done
          echo "vendors=[$(IFS=,; echo "${changed[*]}")]" >> "$GITHUB_OUTPUT"

  bump-and-build:
    needs: check
    if: needs.check.outputs.vendors != '[]'
    strategy:
      fail-fast: false
      matrix:
        vendor: ${{ fromJSON(needs.check.outputs.vendors) }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        # Full -Syu, not -Sy: see ci.yml -- avoids a partial-upgrade ABI
        # mismatch between newly-installed packages and the container's libc.
        run: |
          pacman -Syu --noconfirm git nodejs npm rust gtk4-layer-shell webkitgtk-6.0 pkgconf base-devel

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # Container jobs check out as a different UID than the one that owns
      # the workspace on the host, which git's dubious-ownership check
      # rejects by default.
      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Record currently-pinned commit
        id: pinned
        run: echo "sha=$(git rev-parse HEAD:vendor/${{ matrix.vendor }})" >> "$GITHUB_OUTPUT"

      - name: Bump submodule to upstream HEAD
        run: git submodule update --remote vendor/${{ matrix.vendor }}

      - name: Detect vendor contract-surface changes
        id: contract
        run: |
          # src/*.rs reimplements a slice of upstream's Electron main
          # process (main/src/**). The Test step below checks the wire types
          # (src/ipc.rs vs ipc/types.ts, via tsc), but not behavior or
          # allowlists ported from main/src -- those need a human diff.
          # Excludes the two subtrees that are permanently out of scope
          # regardless of upstream changes (AppUpdater.ts:
          # stubbed, doesn't apply to a locally-built binary; vision/**:
          # Windows-only OCR).
          changed=$(git -C vendor/${{ matrix.vendor }} diff --name-only \
            "${{ steps.pinned.outputs.sha }}" HEAD -- 'main/src' 'ipc' \
            ':!main/src/AppUpdater.ts' ':!main/src/vision')

          if [ -n "$changed" ]; then
            echo "title=⚠️ Bump ${{ matrix.vendor }} submodule (contract files changed — review needed)" >> "$GITHUB_OUTPUT"
          else
            echo "title=Bump ${{ matrix.vendor }} submodule" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "body<<BODY_EOF"
            echo "Automated submodule bump to upstream's current HEAD."
            if [ -n "$changed" ]; then
              echo ""
              echo "### ⚠️ Vendor contract surface changed"
              echo "This bump touches upstream file(s) that \`src/*.rs\` reimplements (see README.md's module table). \`cargo test\` checks the IPC message and config types; it does not check ported behavior (e.g. Shortcuts.ts, ConfigStore.ts logic) or allowlists beyond the drift-tested ones (proxy hosts, item-text signatures). Diff the file(s) below against the corresponding \`src/*.rs\` module before merging:"
              echo ""
              while IFS= read -r f; do
                echo "- \`$f\`"
              done <<< "$changed"
            fi
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      # After the bump, so the npm cache key reflects the lockfile the
      # bumped submodule actually ships, not the one we just replaced.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: poe-kde-overlay

      - name: Cache npm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('vendor/*/renderer/package-lock.json') }}

      # Validate the bumped commit actually builds before proposing it --
      # deliberately duplicated from ci.yml rather than factored into a
      # reusable workflow: workflow_call runs against a freshly-checked-out
      # ref, which doesn't fit validating an in-progress, not-yet-pushed
      # bump in this same job.
      - name: Build renderer
        run: ./scripts/build-renderer.sh

      - name: Build backend
        run: cargo build --release --locked

      # PRs opened with the default GITHUB_TOKEN don't trigger ci.yml, so
      # this is the only place the bump meets the upstream-contract tests
      # (src/ipc.rs's tsc check, tests/upstream_contract.rs). A failure
      # still opens the PR, flagged, so the break is visible and fixable.
      - name: Test
        id: test
        continue-on-error: true
        run: cargo test --locked

      - name: Open PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: bump ${{ matrix.vendor }} submodule"
          branch: bump-${{ matrix.vendor }}
          title: ${{ steps.test.outcome == 'failure' && format('❌ Bump {0} submodule (contract tests fail)', matrix.vendor) || steps.contract.outputs.title }}
          body: |
            ${{ steps.test.outcome == 'failure' && format('❌ **`cargo test` failed**: upstream changed something `src/` relies on. See the Test step of {0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) || 'Renderer build, `cargo build --release --locked` and `cargo test` (including the IPC type check against both vendors'' `ipc/types.ts`) passed in this workflow run.' }}

            ${{ steps.contract.outputs.body }}
